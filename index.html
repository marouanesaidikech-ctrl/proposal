<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you go on a date with me?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hearts-container"></div>
    
    <div class="proposal-container">
        <h1 class="proposal-text">Will you go on a date with me Samira?</h1>
        <div class="buttons-container">
            <button id="yesBtn" class="btn yes-btn">Yes</button>
            <button id="noBtn" class="btn no-btn">No</button>
        </div>
    </div>

    <div id="smileyFace" class="smiley-face hidden">
        <div class="face">
            <div class="eyes">
                <div class="eye left-eye">❤️</div>
                <div class="eye right-eye">❤️</div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <div id="cat" class="cat walking">
        <div class="cat-body">
            <div class="cat-main">
                <div class="cat-spots">
                    <div class="spot spot-1"></div>
                    <div class="spot spot-2"></div>
                    <div class="spot spot-3"></div>
                </div>
                <div class="cat-paws">
                    <div class="cat-paw"></div>
                    <div class="cat-paw"></div>
                </div>
            </div>
            <div class="cat-head">
                <div class="cat-ears">
                    <div class="cat-ear left"></div>
                    <div class="cat-ear right"></div>
                </div>
                <div class="cat-face">
                    <div class="cat-eyes">
                        <div class="cat-eye left"></div>
                        <div class="cat-eye right"></div>
                    </div>
                    <div class="cat-whiskers">
                        <div class="whisker left-1"></div>
                        <div class="whisker left-2"></div>
                        <div class="whisker right-1"></div>
                        <div class="whisker right-2"></div>
                    </div>
                    <div class="cat-nose"></div>
                    <div class="cat-mouth"></div>
                </div>
            </div>
            <div class="cat-tail"></div>
        </div>
    </div>

    <footer class="credit">
        <p>By SAIDI MAROUANE</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Broke Me...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: darkenBackground 3s ease-out forwards;
        }

        @keyframes darkenBackground {
            from {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            to {
                background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            }
        }

        .sad-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .rain-drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(100, 100, 150, 0.6));
            animation: rain 2s linear infinite;
        }

        @keyframes rain {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .sad-container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 2s ease-out;
            max-width: 600px;
            margin: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sad-face {
            font-size: 6rem;
            margin-bottom: 30px;
            animation: sob 2s ease-in-out infinite;
        }

        .sad-text {
            font-size: 2.5rem;
            color: #ecf0f1;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: fadeInText 3s ease-out;
        }

        .broken-text {
            font-size: 1.5rem;
            color: #bdc3c7;
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeInText 4s ease-out;
        }

        .try-again-btn {
            padding: 20px 40px;
            font-size: 1.3rem;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            animation: fadeInButton 5s ease-out;
        }

        .try-again-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
            background: linear-gradient(45deg, #c0392b, #e74c3c);
        }

        .credit {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInText {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInButton {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sob {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1.05) rotate(-5deg);
            }
            75% {
                transform: scale(0.95) rotate(5deg);
            }
        }

        @media (max-width: 768px) {
            .sad-text {
                font-size: 2rem;
            }
            
            .broken-text {
                font-size: 1.2rem;
            }
            
            .sad-container {
                padding: 40px 20px;
            }
            
            .sad-face {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="sad-rain"></div>
    
    <div class="sad-container">
        <div class="sad-face">😢</div>
        <h1 class="sad-text">You Broke Me...</h1>
        <p class="broken-text">bis bis...</p>
        <button class="try-again-btn" onclick="goBack()">Wanna try again smirly?</button>
    </div>

    <footer class="credit">
        <p>By SAIDI MAROUANE</p>
    </footer>

    <script>
        // Create rain effect
        function createRainDrop() {
            const rainDrop = document.createElement('div');
            rainDrop.className = 'rain-drop';
            
            // Random position
            rainDrop.style.left = Math.random() * 100 + '%';
            
            // Random animation duration
            const duration = Math.random() * 1 + 1.5;
            rainDrop.style.animationDuration = duration + 's';
            
            // Random animation delay
            const delay = Math.random() * 2;
            rainDrop.style.animationDelay = delay + 's';
            
            document.querySelector('.sad-rain').appendChild(rainDrop);
            
            // Remove rain drop after animation
            setTimeout(() => {
                rainDrop.remove();
            }, (duration + delay) * 1000);
        }
        
        // Create rain drops periodically
        setInterval(createRainDrop, 100);
        
        // Create initial rain drops
        for (let i = 0; i < 50; i++) {
            setTimeout(createRainDrop, i * 50);
        }
        
        // Go back to main page
        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
